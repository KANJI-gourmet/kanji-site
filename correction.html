<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲載情報の修正・削除 | KANJI</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="wrap header-in"><a href="index.html" class="site-logo-link" aria-label="KANJIトップへ"><img alt="KANJI" class="site-logo" src="logo.png?v=3"></a><a class="pill" href="index.html">TOPへ</a></div></header><main class="wrap auth"><span class="label">INFORMATION REQUEST</span><h1>掲載情報の修正・削除について</h1><p class="muted">KANJIでは、掲載情報の正確性を保つため、店舗情報の修正・削除に関するご連絡を受け付けています。</p><form class="card" id="correctionForm"><div class="field"><label>お問い合わせ者区分</label><select id="type" required onchange="document.getElementById('name').required=this.value==='store'"><option value="">選択してください</option><option value="store">店舗関係者</option><option value="kanjin">KANJIN（KANJI会員）</option><option value="user">一般ユーザー</option><option value="other">その他</option></select></div><div class="field"><label>お名前・ご担当者名</label><input id="name" type="text"><p class="meta">店舗関係者の場合は必須、その他の方は任意です。</p></div><div class="field"><label>ご依頼内容</label><select id="requestType" required><option value="">選択してください</option><option>掲載情報の修正</option><option>掲載情報の削除</option><option>その他</option></select></div><div class="field"><label>店舗名</label><input id="storeName" required></div><div class="field"><label>対象ページURL</label><input id="pageUrl" type="url"></div><div class="field"><label>修正・削除内容</label><textarea id="requestDetail" required maxlength="3000"></textarea></div><div class="field"><label>確認できる公式情報URL</label><input id="officialUrl" type="url"></div><div class="field"><label>ご連絡先メールアドレス</label><input id="contactEmail" type="email" required></div><button class="btn" type="submit">内容を送信する</button><p id="done" class="msg ok" style="display:none;margin-top:12px">送信しました。内容を確認のうえ対応します。</p><p id="error" class="msg err" style="display:none;margin-top:12px"></p></form></main><footer class="footer"><div class="wrap">© KANJI</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script>
const form=document.getElementById('correctionForm');
form?.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const done=document.getElementById('done'), err=document.getElementById('error');
  done.style.display='none'; err.style.display='none';
  if(!window.kanjiSupabase){err.textContent='送信機能に接続できません。';err.style.display='block';return;}
  const payload={
    requester_type:document.getElementById('type').value,
    requester_name:document.getElementById('name').value.trim()||null,
    request_type:document.getElementById('requestType').value,
    store_name:document.getElementById('storeName').value.trim(),
    page_url:document.getElementById('pageUrl').value.trim()||null,
    request_detail:document.getElementById('requestDetail').value.trim(),
    official_url:document.getElementById('officialUrl').value.trim()||null,
    contact_email:document.getElementById('contactEmail').value.trim()
  };
  const {error}=await kanjiSupabase.from('correction_requests').insert(payload);
  if(error){err.textContent='送信できませんでした。時間をおいて再度お試しください。';err.style.display='block';return;}
  form.reset(); done.style.display='block';
});
</script></body></html>
