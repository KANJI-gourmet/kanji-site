<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲載情報の修正・削除 | KANJI</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="wrap header-in"><a class="brand" href="index.html">KANJ<i>I</i></a><a class="pill" href="index.html">TOPへ</a></div></header><main class="wrap auth"><span class="label">INFORMATION REQUEST</span><h1>掲載情報の修正・削除について</h1><p class="muted">KANJIでは、掲載情報の正確性を保つため、店舗情報の修正・削除に関するご連絡を受け付けています。</p><form class="card" onsubmit="event.preventDefault();document.getElementById('done').style.display='block'"><div class="field"><label>お問い合わせ者区分</label><select id="type" required onchange="document.getElementById('name').required=this.value==='store'"><option value="">選択してください</option><option value="store">店舗関係者</option><option value="kanjin">KANJIN（KANJI会員）</option><option value="user">一般ユーザー</option><option value="other">その他</option></select></div><div class="field"><label>お名前・ご担当者名</label><input id="name" type="text"><p class="meta">店舗関係者の場合は必須、その他の方は任意です。</p></div><div class="field"><label>ご依頼内容</label><select required><option value="">選択してください</option><option>掲載情報の修正</option><option>掲載情報の削除</option><option>その他</option></select></div><div class="field"><label>店舗名</label><input required></div><div class="field"><label>対象ページURL</label><input type="url"></div><div class="field"><label>修正・削除内容</label><textarea required></textarea></div><div class="field"><label>確認できる公式情報URL</label><input type="url"></div><div class="field"><label>ご連絡先メールアドレス</label><input type="email" required></div><button class="btn" type="submit">内容を送信する</button><p id="done" class="msg ok" style="display:none;margin-top:12px">現在は受付画面の公開段階です。送信先メール連携は次の更新で接続します。</p></form></main><footer class="footer"><div class="wrap">© KANJI</div></footer></body></html>
