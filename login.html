<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | KANJI</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="wrap header-in"><a href="index.html" class="site-logo-link" aria-label="KANJIトップへ"><img alt="KANJI" class="site-logo" data-kanji-logo="" src=""></a><a class="pill" href="signup.html">会員登録</a></div></header><main class="wrap auth"><div class="back-navigation"><button id="backToPrevious" class="back-link" type="button">← 元のページに戻る</button></div><h1>ログイン</h1><div id="msg" class="msg"></div><form id="loginForm" class="card"><div class="field"><label>メールアドレス</label><input id="email" type="email" required></div><div class="field"><label>パスワード</label><input id="password" type="password" required></div><button class="btn" type="submit">ログイン</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="analytics.js"></script><script src="supabase-client.js"></script><script src="login.js"></script><script src="auth-ui.js"></script><script src="logo.js"></script><script>
function goBackFromAuth(){
  try{
    const ref=document.referrer ? new URL(document.referrer) : null;
    const current=new URL(location.href);
    if(ref && ref.origin===current.origin && !/\/(login|signup)\.html$/.test(ref.pathname)){
      history.back(); return;
    }
  }catch(e){}
  location.href='index.html';
}
const backBtn=document.getElementById('backToPrevious');
if(backBtn) backBtn.addEventListener('click',goBackFromAuth);
</script></body></html>
