<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員登録 | KANJI</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="wrap header-in"><a href="index.html" class="site-logo-link" aria-label="KANJIトップへ"><img alt="KANJI" class="site-logo" src="logo.svg"></a><a class="pill" href="login.html">ログイン</a></div></header><main class="wrap auth"><div class="back-navigation"><button id="backToPrevious" class="back-link" type="button">← 元のページに戻る</button></div><span class="label">KANJIN</span><h1>会員登録</h1><p class="muted">会員登録をすると、気になる店舗をお気に入り登録できるようになります。あとで見返したいお店を、自分専用のリストとして保存できます。</p><div id="msg" class="msg"></div><form id="signupForm" class="card"><div class="field"><label>メールアドレス</label><input id="email" type="email" required></div><div class="field"><label>パスワード</label><input id="password" type="password" minlength="8" required><div class="meta">8文字以上で設定してください。</div></div><div class="field"><label>パスワード（確認）</label><input id="password2" type="password" minlength="8" required></div><p class="meta"><a href="terms.html">利用規約</a>・<a href="privacy.html">プライバシーポリシー</a>に同意のうえ登録してください。</p><button class="btn" type="submit">無料会員登録</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="analytics.js"></script><script src="supabase-client.js"></script><script src="signup.js"></script><script src="auth-ui.js"></script><script>
function goBackFromAuth(){
  try{
    const ref=document.referrer ? new URL(document.referrer) : null;
    const current=new URL(location.href);
    if(ref && ref.origin===current.origin && !/\/(login|signup)\.html$/.test(ref.pathname)){
      history.back(); return;
    }
  }catch(e){}
  location.href='index.html';
}
const backBtn=document.getElementById('backToPrevious');
if(backBtn) backBtn.addEventListener('click',goBackFromAuth);
</script></body></html>
