<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗一覧 | KANJI</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="wrap header-in"><a href="index.html" class="site-logo-link" aria-label="KANJIトップへ"><img alt="KANJI" class="site-logo" src="logo.png?v=3"></a><nav class="nav"><nav class="nav" id="memberQuickNav"><a class="pill" href="login.html">ログイン</a><a class="pill dark" href="signup.html">会員登録</a></nav></nav></div></header><main class="wrap"><section class="section"><span class="label">STORE LIST</span><h1 id="resultTitle">登録店舗 5件</h1><div id="storeList" class="grid cards"></div><div id="noResults" class="muted" style="display:none;padding:30px 0">条件に一致する登録店舗はまだありません。店舗は順次追加予定です。</div></section><div id="detailRoot"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="analytics.js"></script><script src="supabase-client.js"></script><script src="auth-ui.js"></script><script>
const stores=[
{id:'moku',name:'燻製 鉄板焼 クラフトビール MOKU新橋店',status:'KANJI訪問',area:'新橋',station:'新橋駅',walk:'徒歩2分',genres:['バル・ダイニング','居酒屋'],scenes:['飲み会','デート','誕生日・記念日'],features:['燻製','肉料理','個室'],budget:'4,000〜5,000円',private:'あり',smoking:'禁煙',address:'東京都港区新橋3-13-4 イータス新橋B1',hours:'月～金 11:30～14:30 / 17:00～24:00\n土・日・祝 12:00～24:00',closed:'なし',comment:'新橋駅近くの地下1階にある、燻製料理が特徴の一軒。店内はにぎやかすぎず静かすぎない程よい雰囲気で、個室では周囲を気にせずゆったり会話できました。装飾に特別感のある個室に加え、カウンターや半個室、テーブル席もあり、デートからグループでの食事までシーンに合わせて利用したいお店です。'},
{id:'okuyukashi',name:'オクユカシ',status:'KANJI訪問',area:'新橋',station:'新橋駅',walk:'徒歩3分',genres:['居酒屋','鉄板焼き'],scenes:['デート','友人との食事','飲み会'],features:['肉料理'],budget:'5,000〜6,000円',private:'なし',smoking:'禁煙',address:'東京都港区新橋2-9-12 2F',hours:'月〜木 17:00〜22:30\n金・土・祝前日 17:00〜23:00\n日・祝 17:00〜22:00',closed:'なし',comment:'路地裏の雑居ビル2階にあり、目立つ看板もなく、隠れ家を思わせる一軒。料理は華やかで、ライブ感のあるメニューも多く、思わず写真に収めたくなる演出が印象的です。店内はテーブル席のみで、かしこまりすぎないカジュアルな雰囲気。デートや少人数の友人との食事で、少し贅沢な時間を楽しみたい日に選びたいお店です。'},
{id:'torigoro',name:'酒とやきとり とりごろ 新橋烏森口店',status:'KANJI訪問',area:'新橋',station:'新橋駅',walk:'徒歩4分',genres:['居酒屋','焼き鳥・串焼き'],scenes:['飲み会','デート','歓送迎会'],features:['焼き鳥'],budget:'4,000〜5,000円',private:'なし',smoking:'禁煙',address:'東京都港区新橋4-14-8',hours:'月～金・祝前日 17:00～23:30\n土・日・祝 14:00～22:00',closed:'なし',comment:'白い暖簾と大きな窓ガラスからこぼれる灯りが印象的な、2階建ての焼き鳥店。焼き鳥に加え、低温調理料理やレバーを使った創作料理なども楽しめます。2階席は掘りごたつになっており、大人数でも利用しやすい造り。フロア貸切にも対応しているため、歓送迎会など人数の多い集まりでも候補にしたいお店です。'},
{id:'cozy',name:'SUSHI BAR 魚々 COZY 五反田店',status:'気になる一軒',area:'五反田',station:'五反田駅',walk:'徒歩2分',genres:['バー','寿司・海鮮'],scenes:['飲み会','デート','二軒目'],features:['寿司'],budget:'4,000〜5,000円',private:'なし',smoking:'分煙',address:'東京都品川区東五反田1-11-5 バルミー五反田 2F（201号室）',hours:'18:00〜翌5:00',closed:'なし',comment:'「近未来のすし店」をコンセプトに掲げる、隠れ家的なすしバー。201号室の扉の先に店があるという入口も特徴的です。カウンターを中心とした店内で、豊洲から仕入れるネタを使ったすしを味わえるとのこと。個性的な空間とすしの組み合わせを実際に確かめてみたい、気になる一軒です。'},
{id:'karinto',name:'花林糖',status:'気になる一軒',area:'五反田',station:'五反田駅',walk:'徒歩5分',genres:['串揚げ','居酒屋'],scenes:['デート','飲み会','友人との食事'],features:['串揚げ','個室'],budget:'4,000〜5,000円',private:'あり',smoking:'禁煙',address:'東京都品川区西五反田2-25-4 磯ビル1F',hours:'17:00～23:00',closed:'月曜日',comment:'ミシュランガイドの「ビブグルマン」に選ばれた、新進気鋭の職人が手掛ける串揚げ店。厳選した旬の食材を使い、一串ずつ食べ頃を見極めて揚げるスタイルが特徴。素材や揚げ方へのこだわりを実際に味わってみたい、一度は訪れてみたい気になる一軒です。'}];
const list=document.getElementById('storeList'),detailRoot=document.getElementById('detailRoot');
function tag(x){return '<span class="tag">'+x+'</span>'}
function card(s){return '<button class="card" style="text-align:left;cursor:pointer" onclick="openStore(\''+s.id+'\')"><span class="badge '+(s.status==='気になる一軒'?'interest':'')+'">'+s.status+'</span><h3>'+s.name+'</h3><p class="meta">'+s.area+' ・ '+s.station+' '+s.walk+'｜'+s.budget+'</p><div class="tags">'+[...s.genres,...s.scenes.slice(0,2),...s.features.slice(0,2)].map(tag).join('')+'</div><p class="excerpt">'+s.comment+'</p><span style="font-size:12px;font-weight:700;color:#80652f">店舗詳細を見る →</span></button>'}
function detail(s){return '<section class="detail"><button class="pill" onclick="showList()">← 店舗一覧</button><div class="gallery" style="margin-top:16px"><div class="photo">外観写真<br>写真準備中</div><div class="photo">内観写真<br>写真準備中</div></div><h1>'+s.name+'</h1><p class="meta">'+s.area+' ・ '+s.station+' '+s.walk+'｜'+s.budget+'</p><div class="tags">'+s.genres.map(tag).join('')+'<span class="smoke">'+s.smoking+'</span></div><button class="btn" style="margin-top:14px" data-favorite="'+s.id+'">♡ 気になる店舗に保存</button><section class="section"><h2>こんなシーンの候補に</h2><div class="tags">'+s.scenes.map(tag).join('')+'</div></section><div class="comment"><h3>'+(s.status==='KANJI訪問'?'KANJI編集者より':'KANJIが気になった理由')+'</h3><p>'+s.comment+'</p></div><section class="section"><h2>お店の特徴</h2><div class="tags">'+s.features.map(tag).join('')+'</div></section><section class="section"><h2>店舗情報</h2><dl class="info"><div><dt>ジャンル</dt><dd>'+s.genres.join(' / ')+'</dd></div><div><dt>予算目安</dt><dd>'+s.budget+'</dd></div><div><dt>個室</dt><dd>'+s.private+'</dd></div><div><dt>喫煙情報</dt><dd>'+s.smoking+'</dd></div><div><dt>住所</dt><dd>'+s.address+'</dd></div><div><dt>営業時間</dt><dd style="white-space:pre-line">'+s.hours+'</dd></div><div><dt>定休日</dt><dd>'+s.closed+'</dd></div></dl></section></section>'}
function applyFilter(){const q=new URLSearchParams(location.search),area=q.get('area'),scene=q.get('scene'),budget=q.get('budget');const hit=stores.filter(s=>(!area||s.area===area)&&(!scene||s.scenes.includes(scene))&&(!budget||s.budget===budget));list.innerHTML=hit.map(card).join('');document.getElementById('resultTitle').textContent='検索結果 '+hit.length+'件';document.getElementById('noResults').style.display=hit.length?'none':'block'}
function openStore(id){const s=stores.find(x=>x.id===id);if(!s)return;list.parentElement.style.display='none';detailRoot.innerHTML=detail(s);history.replaceState(null,'','#'+id);window.scrollTo(0,0);loadFavorites()}
function showList(){detailRoot.innerHTML='';list.parentElement.style.display='';history.replaceState(null,'',location.pathname+location.search);window.scrollTo(0,0)}
async function loadFavorites(){const b=document.querySelector('[data-favorite]');if(!b)return;const {data:{user}}=await kanjiSupabase.auth.getUser();if(user){const {data}=await kanjiSupabase.from('favorites').select('store_id').eq('user_id',user.id).eq('store_id',b.dataset.favorite);if(data?.length){b.textContent='♥ 保存済み';b.classList.add('saved')}}b.onclick=async()=>{const {data:{user:u}}=await kanjiSupabase.auth.getUser();if(!u){location.href='login.html';return}const s=stores.find(x=>x.id===b.dataset.favorite);if(b.classList.contains('saved')){await kanjiSupabase.from('favorites').delete().eq('user_id',u.id).eq('store_id',s.id);b.textContent='♡ 気になる店舗に保存';b.classList.remove('saved')}else{const {error}=await kanjiSupabase.from('favorites').upsert({user_id:u.id,store_id:s.id,store_name:s.name},{onConflict:'user_id,store_id'});if(error){alert('保存できませんでした。');return}b.textContent='♥ 保存済み';b.classList.add('saved');window.kanjiTrack?.('add_favorite',{store_id:s.id})}}}
applyFilter();const initial=location.hash.slice(1);if(initial)openStore(initial);
</script></body></html>
